name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: true
      protocol_ref:
        description: 'biebie-protocol ref to build against (blank = its default branch)'
        required: false
        default: ''

env:
  APP_NAME: biebie-kube
  GO_VERSION: '1.25.0'
  NODE_VERSION: '22'
  WAILS_VERSION: v3.0.0-beta.9
  PROTOCOL_REPO: ncmink/biebie-protocol

# go.mod resolves github.com/ncmink/biebie-protocol through a replace directive
# pointing at ../biebie-protocol, so a release build needs both repositories
# checked out side by side exactly as they are during development. actions/checkout
# refuses a path outside the workspace, so this application is checked out into a
# subdirectory too and every step runs from there.
jobs:
  macos:
    name: Build macOS (.dmg + updater zip)
    runs-on: macos-14
    defaults:
      run:
        working-directory: biebie-kube
    steps:
      - uses: actions/checkout@v4
        with:
          path: biebie-kube

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPO }}
          ref: ${{ github.event.inputs.protocol_ref }}
          token: ${{ secrets.PROTOCOL_TOKEN }}
          path: biebie-protocol

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: biebie-kube/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: biebie-kube/frontend/package-lock.json

      - name: Version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Package universal .app + .dmg
        run: |
          wails3 task darwin:package:universal APP_VERSION="$APP_VERSION"
          wails3 task darwin:create:dmg

      - name: Rename artifacts
        run: |
          DMG="$(ls bin/*.dmg | head -n1)"
          mv "$DMG" "bin/${APP_NAME}-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent "bin/${APP_NAME}.app" "bin/${APP_NAME}-${VERSION}-darwin-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            biebie-kube/bin/*.dmg
            biebie-kube/bin/*darwin-universal.zip
          if-no-files-found: error

  windows:
    name: Build Windows (NSIS + updater zip)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: biebie-kube
    steps:
      - uses: actions/checkout@v4
        with:
          path: biebie-kube

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPO }}
          ref: ${{ github.event.inputs.protocol_ref }}
          token: ${{ secrets.PROTOCOL_TOKEN }}
          path: biebie-protocol

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: biebie-kube/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: biebie-kube/frontend/package-lock.json

      - name: Version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Package NSIS installer
        run: wails3 task windows:package APP_VERSION=${{ env.APP_VERSION }} INSTALL_SCOPE=user

      - name: Rename artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "bin\$env:APP_NAME-*-installer.exe" "dist\$env:APP_NAME-$env:VERSION-windows-amd64-installer.exe"
          Compress-Archive -Path "bin\$env:APP_NAME.exe" -DestinationPath "dist\$env:APP_NAME-$env:VERSION-windows-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            biebie-kube/dist/*.exe
            biebie-kube/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum biebie-kube-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
