# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Biebie"
  productName: "Biebie Kube"
  productIdentifier: "net.biebie.kube"
  description: "Kubernetes workspace for the biebie.net family."
  copyright: "© 2026, Biebie"
  comments: "Opens customer clusters handed over by Biebie Access."
  version: "0.2.7"
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# There is no iOS or Android configuration here. Biebie Kube needs a local
# kubeconfig, a Unix socket to Biebie Access and loopback ports for forwarding,
# none of which a mobile sandbox provides.

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# Biebie Kube claims no file types. It opens clusters, not documents, and the
# kubeconfigs it reads are chosen inside the application.
fileAssociations:

# The deep link Biebie Access uses to hand over a customer and cluster.
# Declaring it here rather than editing each platform's manifest by hand means
# `wails3 task common:update:build-assets` cannot quietly drop the registration
# that the whole handoff depends on.
protocols:
  - scheme: biebie-kube
    description: "Biebie Kube cluster handoff"